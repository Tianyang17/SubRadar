name: Release SubRadar DMGs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build arm64 & x86_64 DMGs
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_VER="${{ inputs.version }}"
          else
            RAW_VER="${GITHUB_REF_NAME}"
          fi
          CLEAN_VER="${RAW_VER#v}"
          echo "raw_version=v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
          echo "clean_version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"

      - name: Run quality gate & unit tests
        run: |
          chmod +x scripts/check_quality.sh scripts/package_dmg.sh
          ./scripts/check_quality.sh

      - name: Package arm64 & x86_64 DMGs
        env:
          VERSION: ${{ steps.meta.outputs.clean_version }}
          BUILD_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ./scripts/package_dmg.sh both

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.raw_version }}
          name: SubRadar ${{ steps.meta.outputs.raw_version }}
          generate_release_notes: true
          files: |
            dist/SubRadar-v${{ steps.meta.outputs.clean_version }}-arm64.dmg
            dist/SubRadar-v${{ steps.meta.outputs.clean_version }}-x86_64.dmg
            dist/SHA256SUMS.txt
            dist/latest.json
